[package]
name = "whisperdesk-native"
version = "0.1.0"
description = "WhisperDesk - AI-powered transcription desktop app"
authors = ["WhisperDesk Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whisperdesk_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }

# Vibe core for transcription
vibe_core = { path = "../../../packages/vibe-core", features = ["coreml", "metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
screencapturekit = { version = "0.2.8", features = ["ci"] }
screencapturekit-sys = "0.2.8"
objc_id = "0.1"
core-graphics-helmer-fork = "0.24.0"

# Additional plugins
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# Utilities
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
cpal = "0.15.3"
hound = "3.5.1"
rand = "0.8.5"

